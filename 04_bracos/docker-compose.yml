version: '3.8'

# =====================================================================
# CAMADA 4: BRAÇOS (Infraestrutura Local de Ação e Execução)
# n8n (Automação de Fluxos) + Evolution API (WhatsApp) + Postgres (Supabase Compatível)
# =====================================================================

services:
  # 1. Banco de Dados Relacional
  postgres_db:
    image: postgres:16-alpine
    container_name: stack_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stack_password_2026
      POSTGRES_DB: stack_ia_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Orquestrador de Automação Visual (n8n)
  n8n_automation:
    image: n8nio/n8n:latest
    container_name: stack_ia_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=stack_ia_production
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=stack_password_2026
    depends_on:
      - postgres_db
    volumes:
      - n8n_data:/home/node/.n8n

  # 3. Evolution API (WhatsApp Gateway Oficial da Comunidade)
  evolution_api:
    image: atendai/evolution-api:v2.1.2
    container_name: stack_ia_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=stack_ia_evolution_secret_token_2026
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:stack_password_2026@postgres_db:5432/stack_ia_production
    depends_on:
      - postgres_db

volumes:
  pgdata:
  n8n_data:
